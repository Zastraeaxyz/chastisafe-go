<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"
     viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F63A8"/>
      <stop offset="1" stop-color="#122F6B"/>
    </linearGradient>
    <linearGradient id="band" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5189CE"/>
      <stop offset="1" stop-color="#0B2148"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="600" height="800" rx="30.0" ry="30.0"/>
    </clipPath>
    <clipPath id="inner">
      <rect x="12.0" y="12.0" width="576.0"
            height="776.0" rx="18.0" ry="18.0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- frame colour -->
    <rect x="0" y="0" width="600" height="800" fill="#0B2148"/>

    <!-- main gradient face -->
    <g clip-path="url(#inner)">
      <rect x="12.0" y="12.0" width="576.0"
            height="776.0" fill="url(#bg)"/>

      <!-- lower gradient panel -->
      <rect x="85.71428571428571" y="200.0" width="428.57142857142856" height="514.2857142857143"
            rx="30.0" ry="30.0" fill="url(#band)"/>
    </g>
  </g>
</svg>
