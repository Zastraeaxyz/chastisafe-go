<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"
     viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D868AC"/>
      <stop offset="1" stop-color="#A7488C"/>
    </linearGradient>
    <linearGradient id="band" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAB8CF"/>
      <stop offset="1" stop-color="#B8588C"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="600" height="800" rx="30.0" ry="30.0"/>
    </clipPath>
    <clipPath id="inner">
      <rect x="12.0" y="12.0" width="576.0"
            height="776.0" rx="18.0" ry="18.0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- frame colour -->
    <rect x="0" y="0" width="600" height="800" fill="#EE55BB"/>

    <!-- main gradient face -->
    <g clip-path="url(#inner)">
      <rect x="12.0" y="12.0" width="576.0"
            height="776.0" fill="url(#bg)"/>

      <!-- lower gradient panel -->
      <rect x="85.71428571428571" y="200.0" width="428.57142857142856" height="514.2857142857143"
            rx="30.0" ry="30.0" fill="url(#band)"/>

      <image x="0" y="0" width="600" height="800" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/>
    </g>

    <!-- label -->
    <text x="300.0" y="123.0"
          text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="700" font-size="120.0" fill="#FFFFFF">PINK</text>
  </g>
</svg>
